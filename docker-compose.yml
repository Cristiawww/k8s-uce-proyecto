version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: uce
      POSTGRES_USER: adminuser
      POSTGRES_PASSWORD: MiProyecto123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  auth-service:
    build: ./auth-service
    ports:
      - "5001:5000"
    environment:
      POSTGRES_URL: postgresql://adminuser:MiProyecto123@postgres:5432/uce
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  user-admin:
    build: ./user-admin
    ports:
      - "6001:6000"
    environment:
      POSTGRES_URL: postgresql://adminuser:MiProyecto123@postgres:5432/uce
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
