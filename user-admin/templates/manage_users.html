<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios UCE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .header { text-align: center; margin-bottom: 2rem; }
        .logo { color: #1e3c72; font-size: 1.8rem; font-weight: bold; margin-bottom: 0.5rem; }
        .subtitle { color: #666; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #333; font-weight: 500; }
        input { width: 100%; padding: 12px 15px; border: 2px solid #e1e5e9; border-radius: 8px; font-size: 1rem; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #1e3c72; }
        .btn { width: 100%; padding: 14px; background: #1e3c72; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background: #163864; }
        .btn-login { background: #ff6b35; margin-top: 1rem; }
        .btn-login:hover { background: #e55a2b; }
        .flash { padding: 12px; margin-bottom: 1.5rem; border-radius: 8px; font-weight: 500; }
        .flash.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .flash.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🌐 UNIVERSIDAD CENTRAL DEL ECUADOR</div>
            <div class="subtitle">Gestión de Usuarios - Kubernetes Microservicios</div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/register">
            <div class="form-group">
                <label>👤 Nombres *</label>
                <input type="text" name="first_name" required minlength="2" placeholder="Juan">
            </div>
            <div class="form-group">
                <label>👤 Apellidos *</label>
                <input type="text" name="last_name" required minlength="2" placeholder="Pérez">
            </div>
            <div class="form-group">
                <label>📧 Correo Institucional *</label>
                <input type="email" name="email" required placeholder="juan.perez@uce.edu.ec">
            </div>
            <div class="form-group">
                <label>🔒 Contraseña (mín. 8 caracteres) *</label>
                <input type="password" name="password" required minlength="8" placeholder="Mínimo 8 caracteres">
            </div>
            <div class="form-group">
                <label>🔄 Confirmar Contraseña *</label>
                <input type="password" name="confirm_password" required minlength="8" placeholder="Repite la contraseña">
            </div>
            <button type="submit" class="btn">➕ AGREGAR USUARIO</button>
        </form>

        <a href="/login" class="btn btn-login">🔐 IR A LOGIN (Auth Service)</a>
    </div>
</body>
</html>
