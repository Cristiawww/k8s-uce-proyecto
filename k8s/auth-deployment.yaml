apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: cristianara/auth-service-k8s:v1
        env:
        - name: POSTGRES_URL
          value: "postgresql://adminuser:MiProyecto123@postgres:5432/uce"
        - name: REDIS_URL
          value: "redis://redis:6379"
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30080
